syntax = "proto3";

package syntra.v1;

import "syntra/v1/error.proto";

option go_package = "github.com/tinklehq/syntra/bindings/go/gen/syntra/v1;syntrav1";

// Frame is a versioned Syntra envelope, independent of its transport framing.
message Frame {
  // version is the negotiated wire version, currently 1.
  uint32 version = 1;
  // request_id is the only correlation ID; zero is reserved for notifications.
  uint64 request_id = 2;
  // Former application replay operations must not be reused.
  reserved 16, 17;
  reserved "event", "resume", "ack";
  // body is exactly one protocol operation.
  oneof body {
    // hello begins host-owned authentication.
    ClientHello hello = 10;
    // ready confirms host acceptance, not synchronized application state.
    ServerReady ready = 11;
    // request invokes a host-defined method.
    RpcRequest request = 12;
    // result completes one call; notifications may arrive before this result.
    RpcResult result = 13;
    // cancel requests cancellation, not rollback of a committed mutation.
    Cancel cancel = 14;
    // notification carries opaque host-authorized data after ready only.
    Notification notification = 15;
  }
}

// ClientHello supplies an opaque credential to the host over TLS only.
message ClientHello {
  // min_version is the minimum supported wire version.
  uint32 min_version = 1;
  // max_version is the maximum supported wire version.
  uint32 max_version = 2;
  // credential is never interpreted, logged, or persisted by the protocol core.
  bytes credential = 3;
}

// ServerReady announces acceptance of this disposable connection.
message ServerReady {
  // connection_id is opaque and must not be an authentication session ID.
  string connection_id = 1;
}

// RpcRequest carries opaque host-defined data without interpreting its schema.
message RpcRequest {
  // method is a canonical /package.Service/Method path.
  string method = 1;
  // payload is opaque request data for method; arbitrary bytes are valid.
  bytes payload = 2;
  // timeout_ms is a bounded call budget; zero selects the server default.
  uint32 timeout_ms = 3;
}

// RpcResult carries exactly one explicit success payload or typed failure.
message RpcResult {
  // outcome must be set, including for a successful empty response.
  oneof outcome {
    // payload is opaque response data; empty bytes explicitly mean success.
    bytes payload = 1;
    // error is a public failure with a known nonzero code.
    RpcError error = 2;
  }
}

// Cancel identifies its target through the envelope request_id.
message Cancel {}

// Notification carries opaque data without delivery or durable-state semantics.
message Notification {
  // payload is interpreted only by the host and its clients.
  bytes payload = 1;
}
