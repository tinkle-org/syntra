syntax = "proto3";

package syntra.v1;

option go_package = "github.com/tinklehq/syntra/bindings/go/gen/syntra/v1;syntrav1";

// ErrorCode identifies a protocol-level failure, never application business reasons.
enum ErrorCode {
  // ERROR_CODE_UNSPECIFIED is not valid in a failure outcome.
  ERROR_CODE_UNSPECIFIED = 0;
  // ERROR_CODE_CANCELLED indicates the operation was cancelled.
  ERROR_CODE_CANCELLED = 1;
  // ERROR_CODE_UNKNOWN indicates an unclassified failure.
  ERROR_CODE_UNKNOWN = 2;
  // ERROR_CODE_INVALID_ARGUMENT indicates invalid call arguments.
  ERROR_CODE_INVALID_ARGUMENT = 3;
  // ERROR_CODE_DEADLINE_EXCEEDED indicates the call budget expired.
  ERROR_CODE_DEADLINE_EXCEEDED = 4;
  // ERROR_CODE_NOT_FOUND indicates the requested target was not found.
  ERROR_CODE_NOT_FOUND = 5;
  // ERROR_CODE_ALREADY_EXISTS indicates the target already exists.
  ERROR_CODE_ALREADY_EXISTS = 6;
  // ERROR_CODE_PERMISSION_DENIED indicates the host denied access.
  ERROR_CODE_PERMISSION_DENIED = 7;
  // ERROR_CODE_RESOURCE_EXHAUSTED indicates a capacity budget was exhausted.
  ERROR_CODE_RESOURCE_EXHAUSTED = 8;
  // ERROR_CODE_FAILED_PRECONDITION indicates the operation cannot currently run.
  ERROR_CODE_FAILED_PRECONDITION = 9;
  // ERROR_CODE_ABORTED indicates the operation was aborted.
  ERROR_CODE_ABORTED = 10;
  // ERROR_CODE_OUT_OF_RANGE indicates a value is outside the supported range.
  ERROR_CODE_OUT_OF_RANGE = 11;
  // ERROR_CODE_UNIMPLEMENTED indicates the operation is not supported.
  ERROR_CODE_UNIMPLEMENTED = 12;
  // ERROR_CODE_INTERNAL indicates an internal failure.
  ERROR_CODE_INTERNAL = 13;
  // ERROR_CODE_UNAVAILABLE indicates the service is unavailable.
  ERROR_CODE_UNAVAILABLE = 14;
  // ERROR_CODE_DATA_LOSS indicates unrecoverable data loss or corruption.
  ERROR_CODE_DATA_LOSS = 15;
  // ERROR_CODE_UNAUTHENTICATED indicates the host did not accept the credential.
  ERROR_CODE_UNAUTHENTICATED = 16;
}

// RpcError contains only a typed failure code and a public error description.
message RpcError {
  // code must be a known nonzero ErrorCode value.
  ErrorCode code = 1;
  // message must not contain credentials or private backend diagnostics.
  string message = 2;
}
