syntax = "proto3";

package syntra.v1;

option go_package = "github.com/tinklehq/syntra/bindings/go/gen/syntra/v1;syntrav1";

// Notification carries an uncorrelated event (SNTR-EVENT-001..008).
// It does not imply processing, durability, replay, or delivery acknowledgment.
// Subscriptions use generic RPCs after ACTIVE. Stream identity, cursors, replay,
// and confirmation follow the explicitly negotiated capability inside payloads.
// See specifications/recovery.md and recovery_profile.proto for update recovery.
message Notification {
  // payload is opaque application bytes; empty is valid (SNTR-WIRE-007).
  bytes payload = 1;
}
