// No separate session-control messages are defined in the current contract.
// Establishment is implicit at ServerReady (SNTR-SESS-001); lifetime is bound to
// the connection (SNTR-SESS-003/004). Authentication uses ClientHello.credential;
// principal changes require a new handshake (SNTR-SESS-007). A new connection
// authenticates afresh and does not resume the previous session (SNTR-SESS-006).
syntax = "proto3";

package syntra.v1;

option go_package = "github.com/tinklehq/syntra/bindings/go/gen/syntra/v1;syntrav1";
