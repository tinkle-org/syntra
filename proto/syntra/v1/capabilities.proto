// Optional capabilities use explicit post-readiness RPC negotiation
// (SNTR-CAP-001..005). ClientHello and ServerReady contain no capability fields.
// The update-recovery capability defines its negotiation payloads in recovery_profile.proto.
syntax = "proto3";

package syntra.v1;

option go_package = "github.com/tinklehq/syntra/bindings/go/gen/syntra/v1;syntrav1";
