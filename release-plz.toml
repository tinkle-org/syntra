# Rust registry releases use explicit per-package tags. syntra-core's tag is
# the schema/Go anchor; release-plz.yml directly calls release.yml for artifacts
# and nested Go tag creation. No global v* tag or release-event handoff.
# https://release-plz.ieni.dev/docs/config

[workspace]
release_always = false
git_tag_name = "{{ package }}-v{{ version }}"
git_release_type = "auto"
# Derive semver from conventional commits; detect breaking API changes.
semver_check = true
# Update CHANGELOG.md per crate with git-cliff (keep-a-changelog style).
changelog_update = true
# Create a GitHub Release per crate; schema/source assets attach to syntra-core.
git_release_enable = true
git_release_draft = false
# Native registry publishing: crates.io via trusted publishing or token.
publish = true
release = true
publish_allow_dirty = false

[changelog]
# Conventional-commits body; keep it short — details live in PRs.
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
### Changed
{% for commit in commits %}* {{ commit.message | trim }}
{% endfor %}
"""
