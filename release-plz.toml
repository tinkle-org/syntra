# release-plz: Rust-native release automation (NOT release-please).
# https://release-plz.dev/docs/configuration
# Flow: conventional commits on main -> release-plz opens a Release PR
# (version bumps + CHANGELOG via git-cliff + semver-checks) -> merge the
# PR -> maintainer cuts Git tags manually -> .github/workflows/release.yml
# attaches prebuilt artifacts to a GitHub Release. CI NEVER creates tags.
#
# Distribution contract (see docs/schema-registry.md, RELEASE.md):
# - Git tags + GitHub Releases ONLY. No crates.io publish, no GitHub
#   Packages registry (it has no Cargo/Go registry), no GHCR, no BSR push.
# - Every [package] in the future Rust workspace MUST set:
#     license = "Apache-2.0"
#     publish = false
#   so `cargo publish` is impossible even if invoked by mistake. This file
#   additionally disables release-plz publishing for the whole workspace.
# - Consumers:
#     libtinkle consumes the Rust crates directly via git DPS (path/git
#       dependency on the tagged revision), never via crates.io.
#     Go servers use bindings/go (CGO wrapper) plus the prebuilt Linux
#       native libs attached to the GitHub Release (see release.yml).
# - Tag model:
#     main tags:            vX.Y.Z (and vX.Y.Z-rc.N prereleases)
#     nested Go module tags: bindings/go/vX.Y.Z (same revision as vX.Y.Z;
#       required for Go MVS to resolve the nested module; release.yml
#       verifies both tags resolve to the same commit and fails closed).
#   Tag protection rules SHOULD restrict tag creation to maintainers.
#   Deleting or moving a release tag is forbidden; fix forward.

[workspace]
# Derive semver from conventional commits; detect breaking API changes.
semver_check = true
# Update CHANGELOG.md per crate with git-cliff (keep-a-changelog style).
changelog_update = true
# Tag format for the main release line (e.g. v0.2.0). The nested Go module
# tag (bindings/go/vX.Y.Z) is cut by the maintainer alongside it and
# verified (not created) by CI — see .github/workflows/release.yml.
git_tag_name = "v{{ version }}"
# Create a GitHub Release per tag (artifacts attached by release.yml).
git_release_enable = true
# This is a Git-tags + GitHub-Releases project: never `cargo publish`.
publish = false
release = true
# Never publish prereleases from feature branches; main only via manual tags.
publish_allow_dirty = false

[changelog]
# Conventional-commits body; keep it short — details live in PRs.
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
### Changed
{% for commit in commits %}* {{ commit.message | trim }}
{% endfor %}
"""
