# Schema publication — enabled. Publishes proto/ to BSR (https://buf.build/tinklecorp/syntra).
#
# Mirrors the proven tinkle-proto buf-ci pattern: keep the BSR credential in
# the Buf action so main pushes actually publish. The previous tag-only +
# bsr-publish environment design never ran (no tags, no BSR_MODULE var, no
# environment), leaving the BSR repo empty with no commits.
#
# Behavior with the default buf-action config:
# - push to main (proto/**, buf.yaml, buf.lock) -> validates and `buf push`
#   the named module from buf.yaml (buf.build/tinklecorp/syntra).
#   First push auto-creates the BSR repo; push_create_visibility makes it public.
# - pull_request -> validates only (lint, format, breaking) + PR summary comment.
# - delete branch/tag -> archives the corresponding BSR label.
# - push tag proto-v* -> pushes that revision so it can be labeled stable/candidate.
#
# Required secret: BUF_TOKEN (BSR API token for the tinklecorp org), already
# present as a repository secret. No repository variables or environments required.
name: schema-publish

on:
  push:
    branches: [main]
    tags:
      - "proto-v*"
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.lock"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.lock"
  delete:

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          push_create_visibility: public
