# Schema validation — runs on every PR and on main. Credential-less: validates only, never publishes.
# No BSR: breaking checks
# compare against committed Git baselines (compatibility/v1-initial/image.json),
# never --against-registry. This workflow never publishes or creates tags.
name: schema-validation

on:
  pull_request:
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.lock"
      - "compatibility/v1-initial/**"
      - "scripts/validate-schema.py"
      - "tests/schema/**"
      - ".github/workflows/schema-validation.yml"
  push:
    branches: [main]
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.lock"
      - "compatibility/v1-initial/**"
      - "scripts/validate-schema.py"
      - "tests/schema/**"
      - ".github/workflows/schema-validation.yml"

permissions:
  contents: read  # no secrets, no write, no publish

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.59.0"  # sole pinned toolchain; see specifications/schema/generation.md
          github_token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: buf format check
        run: buf format --diff --exit-code

      - name: buf lint (STANDARD, no exceptions)
        run: buf lint

      - name: buf build
        run: buf build

      - name: buf breaking against stable baseline
        # Bootstrap baseline: the committed initial snapshot. Replaced only by
        # a reviewed PR that points at a newer committed Git baseline
        # (compatibility/ image or tagged-revision descriptor) per
        # docs/schema-registry.md §9. Never an arbitrary branch, never a
        # registry label — this repository has no BSR module identity.
        run: buf breaking --against 'compatibility/v1-initial/image.json'

      - name: Schema regression suite (Buf gates + descriptor tests)
        # Runs where Buf is installed: executes the Buf gates above plus
        # tests/schema/test_schema.py. The general discovery step in
        # repo-validation.yml covers only top-level tests/ and is unchanged.
        run: python3 scripts/validate-schema.py
