name: release-plz

# Production-grade release-plz flow: on every push to main, keep a Release PR
# up to date (version bumps + changelog). When that PR is approved and merged,
# the next run publishes unpublished crates to crates.io, cuts per-package
# tags (<name>-vX.Y.Z), and creates GitHub Releases. Native artifacts and Go
# proxy warmup attach in release.yml on release published.
#
# Auth: crates.io Trusted Publishing (OIDC) preferred, CARGO_REGISTRY_TOKEN
# fallback for bootstrap. New crates must be published manually once before
# trusted publishing can be configured (crates.io limitation).

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Publish crates and create GitHub Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'tinklehq'
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release-plz-pr:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'tinklehq'
    needs: release-plz-release
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
