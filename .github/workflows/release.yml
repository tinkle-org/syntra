# Release — native registries (crates.io + Go module proxy) with GitHub Releases.
#
# Distribution contract (see docs/schema-registry.md, RELEASE.md):
# - Rust: crates.io via release-plz (release-plz.yml publishes on merge of the
#   Release PR) + GitHub Releases for notes/assets. Trusted Publishing (OIDC)
#   preferred, token fallback for bootstrap.
# - Go: go.dev / pkg.go.dev via proxy.golang.org. No `go publish` exists;
#   pushing bindings/go/vX.Y.Z triggers indexing. go-proxy-warmup below warms
#   the proxy and pkg.go.dev after release.
# - CI creates Rust per-package tags via release-plz release; Go nested tags
#   are synced by release-plz release + verified here. Manual recovery tags
#   remain supported (`RELEASE.md` §4).
# - Tag model:
#     main tags:            vX.Y.Z (and vX.Y.Z-rc.N prereleases)
#     nested Go module tags: bindings/go/vX.Y.Z (same suffix and revision,
#       including bindings/go/vX.Y.Z-rc.N for vX.Y.Z-rc.N;
#       required for Go MVS to resolve the nested module).
#   The validate job resolves both tags and fails closed on mismatch.
# - Consumers:
#     libtinkle consumes the Rust crates directly via git (tagged revision).
#     Go servers use bindings/go (CGO wrapper) + the prebuilt Linux native
#       libs attached here (cdylib/staticlib + header).
name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*"
      - "bindings/go/v[0-9]*.[0-9]*.[0-9]*"
      - "bindings/go/v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*"
      - "syntra-*-v[0-9]*.[0-9]*.[0-9]*"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      is_main_tag: ${{ steps.info.outputs.is_main_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve tag identity (CI never creates tags)
        id: info
        run: |
          set -eu
          REF="${GITHUB_REF#refs/tags/}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == bindings/go/v* ]]; then
            VERSION="${REF#bindings/go/v}"
            IS_MAIN=false
          elif [[ "$REF" == v* ]]; then
            VERSION="${REF#v}"
            IS_MAIN=true
          else
            echo "error: unexpected tag ref $REF (expected vX.Y.Z or bindings/go/vX.Y.Z)" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "error: version '$VERSION' must look like X.Y.Z or X.Y.Z-rc.N" >&2
            exit 1
          fi
          # The tag must already exist (pushed by a maintainer). CI never runs
          # `git tag` / `git push --tags` anywhere in this workflow by design.
          git show-ref --verify --quiet "refs/tags/$REF" || {
            echo "error: tag refs/tags/$REF not found locally; CI never creates tags" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_main_tag=$IS_MAIN" >> "$GITHUB_OUTPUT"
          echo "Tag: $REF (version $VERSION)"
          echo "SHA: $(git rev-parse "refs/tags/$REF")"

      - name: Validate version string
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -eu
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "error: version '$VERSION' must look like X.Y.Z or X.Y.Z-rc.N" >&2
            exit 1
          fi

      - name: Validate workspace versions match the tag
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -eu
          # Rust workspace (when present): every member version must equal the tag.
          if [ -f Cargo.toml ]; then
            MISMATCH="$(grep -rhoE '^version *= *"[^"]+"' --include=Cargo.toml crates/ Cargo.toml 2>/dev/null | sort -u || true)"
            echo "Workspace versions found:"
            echo "$MISMATCH"
            if echo "$MISMATCH" | grep -qv "\"$VERSION\""; then
              echo "error: Cargo workspace version(s) above do not all equal tag version $VERSION" >&2
              exit 1
            fi
          else
            echo "No Cargo.toml yet; Rust version check skipped (bootstrap)."
          fi
          # Nested Go module (when present): its version is the tag itself
          # (Go uses the tag, not a version field). Verify go.mod exists.
          if [ -f bindings/go/go.mod ]; then
            echo "bindings/go/go.mod present."
            grep -q '^module ' bindings/go/go.mod || { echo "error: bindings/go/go.mod has no module line" >&2; exit 1; }
          else
            echo "No bindings/go/go.mod yet; Go module check skipped (bootstrap)."
          fi

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.59.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install validator dependencies
        run: pip install pyyaml

      - name: Schema gates (format, lint, build, breaking vs Git baseline)
        run: |
          set -eu
          buf format --diff --exit-code
          buf lint
          buf build
          buf breaking --against 'compatibility/v1-initial/image.json'

      - name: Repository boundary + links
        run: |
          set -eu
          python3 scripts/validate-repo.py boundary links markdown

      - name: Committed generated-types freshness
        run: python3 scripts/validate-schema.py --drift-only

      - name: Verify nested Go module tag resolves to the same revision
        # Go MVS resolves a nested module ONLY via its own tag
        # (bindings/go/vX.Y.Z). Both tags must point at the same commit.
        env:
          IS_MAIN: ${{ steps.info.outputs.is_main_tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -eu
          if [ "$IS_MAIN" != "true" ]; then
            echo "Nested-tag trigger; main-tag check runs on the v$VERSION workflow run."
            exit 0
          fi
          if [ ! -f bindings/go/go.mod ]; then
            echo "No bindings/go/go.mod yet; nested-tag check skipped (bootstrap)."
            exit 0
          fi
          MAIN_SHA="$(git rev-parse "refs/tags/v$VERSION^{commit}")"
          if git show-ref --verify --quiet "refs/tags/bindings/go/v$VERSION"; then
            GO_SHA="$(git rev-parse "refs/tags/bindings/go/v$VERSION^{commit}")"
            echo "v$VERSION -> $MAIN_SHA"
            echo "bindings/go/v$VERSION -> $GO_SHA"
            if [ "$MAIN_SHA" != "$GO_SHA" ]; then
              echo "error: bindings/go/v$VERSION ($GO_SHA) != v$VERSION ($MAIN_SHA); both tags must resolve to the same revision" >&2
              exit 1
            fi
            echo "Nested Go module tag matches."
          else
            echo "error: tag v$VERSION exists but bindings/go/v$VERSION is missing; cut both tags at the same revision (RELEASE.md §4)" >&2
            exit 1
          fi

  build-native-amd64:
    needs: [validate]
    if: needs.validate.outputs.is_main_tag == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Build syntra-ffi (linux amd64, release)
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -eu
          test -f crates/syntra-ffi/Cargo.toml || { echo "error: crates/syntra-ffi/Cargo.toml missing at tag $TAG" >&2; exit 1; }
          cargo build --locked --release -p syntra-ffi
          ls -lh target/release/libsyntra_ffi.so target/release/libsyntra_ffi.a

      - name: Generate C header (cbindgen, committed fallback)
        run: |
          set -eu
          mkdir -p dist/native/linux-amd64
          if command -v cbindgen >/dev/null 2>&1; then
            cbindgen --crate syntra-ffi --output dist/native/linux-amd64/syntra_ffi.h
          elif [ -f crates/syntra-ffi/include/syntra_ffi.h ]; then
            cp crates/syntra-ffi/include/syntra_ffi.h dist/native/linux-amd64/
          else
            cargo install cbindgen --locked
            cbindgen --crate syntra-ffi --output dist/native/linux-amd64/syntra_ffi.h
          fi
          cp target/release/libsyntra_ffi.so target/release/libsyntra_ffi.a dist/native/linux-amd64/
          ls -lh dist/native/linux-amd64/

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-amd64
          path: dist/native/linux-amd64/
          if-no-files-found: error

  build-native-arm64:
    needs: [validate]
    if: needs.validate.outputs.is_main_tag == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Build syntra-ffi (linux arm64, release)
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -eu
          test -f crates/syntra-ffi/Cargo.toml || { echo "error: crates/syntra-ffi/Cargo.toml missing at tag $TAG" >&2; exit 1; }
          cargo build --locked --release -p syntra-ffi
          ls -lh target/release/libsyntra_ffi.so target/release/libsyntra_ffi.a

      - name: Generate C header (cbindgen, committed fallback)
        run: |
          set -eu
          mkdir -p dist/native/linux-arm64
          if command -v cbindgen >/dev/null 2>&1; then
            cbindgen --crate syntra-ffi --output dist/native/linux-arm64/syntra_ffi.h
          elif [ -f crates/syntra-ffi/include/syntra_ffi.h ]; then
            cp crates/syntra-ffi/include/syntra_ffi.h dist/native/linux-arm64/
          else
            cargo install cbindgen --locked
            cbindgen --crate syntra-ffi --output dist/native/linux-arm64/syntra_ffi.h
          fi
          cp target/release/libsyntra_ffi.so target/release/libsyntra_ffi.a dist/native/linux-arm64/
          ls -lh dist/native/linux-arm64/

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: dist/native/linux-arm64/
          if-no-files-found: error

  build-wasm:
    needs: [validate]
    if: needs.validate.outputs.is_main_tag == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          targets: wasm32-unknown-unknown

      - name: Build browser WASM archive (syntra-ffi)
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -eu
          test -f crates/syntra-ffi/Cargo.toml || { echo "error: crates/syntra-ffi/Cargo.toml missing at tag $TAG" >&2; exit 1; }
          cargo build --locked --release -p syntra-ffi --target wasm32-unknown-unknown
          mkdir -p dist/wasm
          cp target/wasm32-unknown-unknown/release/syntra_ffi.wasm dist/wasm/ 2>/dev/null \
            || cp target/wasm32-unknown-unknown/release/libsyntra_ffi.wasm dist/wasm/syntra_ffi.wasm
          (cd dist/wasm && tar -czf "syntra-wasm-$TAG.tar.gz" ./*.wasm)
          ls -lh dist/wasm/

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-browser
          path: dist/wasm/
          if-no-files-found: error

  package-and-release:
    permissions:
      contents: write  # attach assets to the GitHub Release; no packages, no GHCR
    needs: [validate, build-native-amd64, build-native-arm64, build-wasm]
    if: needs.validate.outputs.is_main_tag == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.59.0"

      - uses: actions/download-artifact@v4
        with:
          name: native-linux-amd64
          path: release-staging/native/linux-amd64

      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: release-staging/native/linux-arm64

      - uses: actions/download-artifact@v4
        with:
          name: wasm-browser
          path: release-staging/wasm

      - name: Assemble release payload
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -eu
          OUT="release-staging/syntra-$TAG"
          mkdir -p "$OUT/descriptor" "$OUT/manifests" "$OUT/test-vectors" "$OUT/rust" "$OUT/go"
          # Descriptor + manifests + vectors at the tagged revision.
          buf build -o "$OUT/descriptor/image.json"
          buf export -o "$OUT/descriptor/proto"
          cp conformance/manifest/*.yaml "$OUT/manifests/"
          cp -r conformance/test-vectors/. "$OUT/test-vectors/"
          for f in CHANGELOG.md RELEASE.md GOVERNANCE.md LICENSE; do
            cp "$f" "$OUT/"
          done
          # Rust source / crate archives (offline-friendly; no registry).
          if [ -f Cargo.toml ]; then
            cp Cargo.toml Cargo.lock release-plz.toml "$OUT/rust/" 2>/dev/null || cp Cargo.toml "$OUT/rust/"
            tar --exclude='./target' --exclude='./dist' -czf "$OUT/rust/syntra-rust-source-$TAG.tar.gz" \
              Cargo.toml Cargo.lock release-plz.toml buf.yaml proto crates 2>/dev/null || \
            tar -czf "$OUT/rust/syntra-rust-source-$TAG.tar.gz" Cargo.toml buf.yaml proto crates
            # Per-crate .crate files when the workspace exists (cargo package).
            if cargo --version >/dev/null 2>&1; then
              for manifest in crates/*/Cargo.toml; do
                (cd "$(dirname "$manifest")" && cargo package --locked --no-verify --allow-dirty) || true
              done
              find target/package -name '*.crate' -exec cp {} "$OUT/rust/" \; 2>/dev/null || true
            fi
          fi
          # Committed Go module source (CGO wrapper; resolved via nested tag).
          if [ -d bindings/go ]; then
            tar --exclude-vcs -czf "$OUT/go/syntra-go-bindings-$TAG.tar.gz" bindings/go
          fi
          # Native libs + header + WASM (downloaded artifacts).
          cp -r release-staging/native "$OUT/"
          cp -r release-staging/wasm "$OUT/"
          # Native filenames collide across architectures; upload named archives.
          for arch in linux-amd64 linux-arm64; do
            tar -czf "$OUT/native/syntra-native-$arch-$TAG.tar.gz" -C "$OUT/native/$arch" .
          done
          tar -czf "$OUT/syntra-schema-$TAG.tar.gz" -C "$OUT" descriptor manifests test-vectors
          # GitHub Release assets are flat. Stage exactly the upload set, and
          # reject duplicate basenames rather than silently replacing an asset.
          mkdir -p "$OUT/assets"
          for asset in "$OUT"/rust/* "$OUT"/go/* "$OUT"/native/*.tar.gz "$OUT"/wasm/* "$OUT/descriptor/image.json" "$OUT/syntra-schema-$TAG.tar.gz" "$OUT/CHANGELOG.md" "$OUT/RELEASE.md" "$OUT/GOVERNANCE.md" "$OUT/LICENSE"; do
            name="$(basename "$asset")"
            test ! -e "$OUT/assets/$name" || { echo "error: duplicate release asset $name" >&2; exit 1; }
            cp "$asset" "$OUT/assets/$name"
          done
          find "$OUT" -type f -print
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd "$OUT/assets"
          SUMS="$(mktemp)"
          for asset in *; do
            if [ "$asset" != SHA256SUMS ]; then
              shasum -a 256 -- "$asset"
            fi
          done | LC_ALL=C sort -k 2 > "$SUMS"
          mv "$SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Attach to GitHub Release (tag already exists; CI creates no tags)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -eu
          # gh release create attaches assets; the tag itself was pushed by a
          # maintainer or release-plz (push.tags / release trigger).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets."
            gh release upload "$TAG" "$OUT"/assets/* --clobber
          else
            NOTES="$(mktemp)"
            {
              echo "Syntra $TAG"
              echo ""
              echo "Distribution: crates.io + Go module proxy + GitHub Releases (no BSR)."
              echo "SHA: $(git rev-parse "refs/tags/$TAG")"
              echo ""
              sed -n '1,60p' CHANGELOG.md
            } > "$NOTES"
            set --
            if [[ "$TAG" =~ -rc\.[0-9]+$ ]]; then
              set -- --prerelease
            fi
            gh release create "$TAG" --title "Syntra $TAG" --notes-file "$NOTES" "$@" \
              "$OUT"/assets/*
          fi

  go-proxy-warmup:
    needs: [validate]
    if: needs.validate.outputs.is_main_tag == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Warm Go module proxy and pkg.go.dev
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          MOD="github.com/tinklehq/syntra/bindings/go"
          echo "Warming $MOD@$VERSION via proxy.golang.org"
          TMP="$(mktemp -d)"
          cd "$TMP"
          go mod init warmup >/dev/null 2>&1
          for i in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org,direct GOSUMDB=sum.golang.org go get "$MOD@$VERSION"; then
              echo "warmed $MOD@$VERSION"
              break
            fi
            echo "attempt $i failed; waiting for proxy to see the tag..."
            sleep 30
          done
          curl -fsSL "https://pkg.go.dev/$MOD@$VERSION" -o /dev/null || true
