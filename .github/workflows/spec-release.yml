# Tags-only specification publication. Validation runs without
# release credentials; only trusted main code enters the protected job.
# SDD releases are Git tags; no packages, assets, or GitHub Releases.
name: spec-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Specification tag, for example v1.0-rc1"
        required: true
        type: string
      target_sha:
        description: "Full approved specification commit SHA"
        required: true
        type: string
      decision_issue:
        description: "Public release decision issue or PR number"
        required: true
        type: string
      recovery:
        description: "Recover an existing tag at the same approved commit"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: spec-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the trusted main branch
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Require the upstream repository
        run: test "$GITHUB_REPOSITORY" = tinkle-org/syntra

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check proposed tag and target against trusted main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RECOVERY: ${{ inputs.recovery }}
        run: |
          args=(--tag "$RELEASE_TAG" --target "$TARGET_SHA" --trusted-head "$GITHUB_SHA")
          if [ "$RECOVERY" = true ]; then args+=(--recovery); fi
          python3 scripts/spec-release-preflight.py "${args[@]}"

      - name: Check out the validated target for read-only checks
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: git checkout --detach "$TARGET_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install validator dependencies
        run: pip install pyyaml

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: "1.59.0"
          github_token: ${{ github.token }}

      - name: Validate repository structure and content
        run: python3 scripts/validate-repo.py all

      - name: Validate schema and compatibility baseline
        run: python3 scripts/validate-schema.py

      - name: Run repository regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  publish:
    needs: validate
    environment: spec-release
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - name: Require the trusted main branch
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Require the upstream repository
        run: test "$GITHUB_REPOSITORY" = tinkle-org/syntra

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify approval and tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPEC_RELEASE_TOKEN: ${{ secrets.SPEC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          DECISION_ISSUE: ${{ inputs.decision_issue }}
          RECOVERY: ${{ inputs.recovery }}
        run: |
          args=(publish --tag "$RELEASE_TAG" --target "$TARGET_SHA" --issue "$DECISION_ISSUE")
          if [ "$RECOVERY" = true ]; then args+=(--recovery); fi
          python3 scripts/spec-release.py "${args[@]}"
