[package]
name = "syntra-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Quarantined native C ABI test fixture. No production FFI; no default ABI exports; WASM unsupported."

[lib]
name = "syntra_ffi"
crate-type = ["cdylib", "staticlib"]

[features]
default = []
# Test-only loopback ABI, NOT a production transport. Never enable in shipped
# binaries (including via --all-features). Default builds expose no C ABI.
test-fixture = ["dep:syntra-core", "dep:syntra-runtime", "dep:tokio"]
# Production transport-agnostic frame-pump ABI. Native-only, no WASM.
production = ["dep:syntra-core", "dep:prost", "dep:bytes"]

[dependencies]
prost = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
syntra-core = { path = "../syntra-core", version = "0.1.0", optional = true }
syntra-runtime = { path = "../syntra-runtime", version = "0.1.0", optional = true }
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt-multi-thread", "macros"], optional = true }
