[package]
name = "syntra-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Versioned C ABI over the Syntra runtime (init/handshake/call/cancel/notify/close). No application types."

[lib]
name = "syntra_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
syntra-core = { path = "../syntra-core", version = "0.1.0" }
syntra-runtime = { path = "../syntra-runtime", version = "0.1.0" }
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { workspace = true }
