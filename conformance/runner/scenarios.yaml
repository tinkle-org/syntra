{
  "format_version": "1.0",
  "runner": "syntra-conformance-runner v1",
  "validated_by": "runner.py:load_scenarios (JSON-compatible YAML; full descriptive fault entries validated, printed and saved)",
  "pairings": [
    {"id": "rust-async", "description": "Rust runtime loopback and manually pumped byte channels"},
    {"id": "go-pure", "description": "Go session/transport tests with pure-Go core"},
    {"id": "go-ffi", "description": "Go session/transport tests with production Rust FFI core"},
    {"id": "interop", "description": "Independent Rust/Go decodes of shared HELLO-01 and REQ-01 corpus bytes; no live cross-language connection"}
  ],
  "scenarios": [
    {"id": "SC-ECHO", "name": "echo with empty, hello and 64KiB payloads", "steps": ["handshake", "assert returned opaque bytes"]},
    {"id": "SC-CONCURRENT-16", "name": "16 concurrent correlated calls", "steps": ["handshake", "assert each caller receives its own payload; completion order is not forced"]},
    {"id": "SC-CANCEL-WINS", "name": "Rust cancellation and follow-up usability", "steps": ["cancel a waiting call", "assert caller CANCELLED", "assert follow-up echo succeeds"], "limitations": "Rust only; completion-wins race and wire terminal count are not asserted here"},
    {"id": "SC-DEADLINE", "name": "deadline outcomes", "steps": ["Rust caller reports DEADLINE_EXCEEDED unknown outcome", "Go stalled send respects call budget", "Go core expiry queues one deadline result and rejects late answer"], "limitations": "These are separate tests, not one end-to-end host expiry race"},
    {"id": "SC-OVERSIZE-PAYLOAD", "name": "oversize request", "steps": ["not executed by these legs"], "limitations": "uncovered"},
    {"id": "SC-OVERSIZE-HANDLER-RESULT", "name": "bounded oversize handler failure", "steps": ["handler returns 2MiB", "assert RESOURCE_EXHAUSTED", "assert follow-up echo"]},
    {"id": "SC-DUPLICATE-ID", "name": "duplicate outstanding request", "steps": ["hold original handler", "deliver identical request again", "assert FAILED_PRECONDITION without another dispatch", "release original and assert payload"], "limitations": "Rejection and original success are two wire results for the same id, not an exactly-once wire claim"},
    {"id": "SC-UNKNOWN-METHOD", "name": "unknown method", "steps": ["not executed by these legs"], "limitations": "uncovered"},
    {"id": "SC-MALFORMED-METHOD", "name": "malformed method", "steps": ["not executed by these legs"], "limitations": "uncovered"},
    {"id": "SC-NOTIFICATION", "name": "notification drops alongside RPC", "steps": ["Go sends 64 notifications through fault transport", "assert delivered count equals sent minus drops", "assert following echo"], "limitations": "No notification overflow/order contract asserted by runner fault test"},
    {"id": "SC-GRACEFUL-CLOSE", "name": "close after completed echo", "steps": ["echo completes before close", "Rust closes host and checks session count zero", "Go checks repeated Close and Serve-after-Close rejected and existing Serve exits"], "limitations": "No queued-result drain, in-flight close, CLOSING transition or new-client-call rejection assertion"},
    {"id": "SC-TRANSPORT-LOSS", "name": "abrupt transport loss", "steps": ["not executed by these legs"], "limitations": "uncovered"}
  ],
  "fault_injection": {
    "seed": "0x5EED1234",
    "faults": [
      {"kind": "drop", "rate": "1/64", "scope": "notifications"},
      {"kind": "duplicate", "rate": "1/128", "scope": "results"},
      {"kind": "truncate", "rate": "1/256", "scope": "inbound-bytes"},
      {"kind": "delay", "max_ms": 5, "scope": "send"}
    ],
    "rules": [
      "Target matrix is descriptive, not injector configuration; changing this file does not change hard-coded Rust/Go fault schedules.",
      "Rust request seed 0x5EED1234: drop 1/64, truncate 1/96, duplicate 1/128; response seed 0xBE5E11 uses the same draws; hello seed 0xCAFE01 is separate.",
      "Rust response copies feed Initiator::ingest with a pending caller. Drops/truncations leave it pending until the held intact response is redelivered; duplicates settle once and cannot settle a follow-up call.",
      "Rust request retries are ordinary core request-id retries, not reliable-session reconciliation or a durable exactly-once guarantee.",
      "Go seed 0x5EED1234 drops notifications 1/64 and duplicates request/result frames 1/128; no handshake/notification duplication, truncation or delay. Forced seeded request and result cases guarantee each duplication branch executes.",
      "Recovery/checkpoint tests execute separately from transport fault scenarios."
    ]
  },
  "verdicts": ["PASS", "FAIL"],
  "notes": [
    "Verdicts are per leg; a PASS does not certify every scenario or manifest case.",
    "Interop compares emitted consumed fixture bytes and decoded logical fields to the shared corpus. It does not compare arbitrary encoder bytes or run Rust-to-Go sockets.",
    "No boundary claims for the 1MiB envelope, 30s maximum budget or 5s handshake timeout.",
    "No delay fault is executed. Rust truncation is exercised; Go truncation is not."
  ]
}
