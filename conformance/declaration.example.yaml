# Implementation declaration template (Section O)
# Copy this file into the IMPLEMENTATION repository (not into syntra),
# fill it in, and link per-case logs. Runners validate it against
# conformance/manifest/schema.yaml (kind: declaration).
format_version: "1.0"
implementation:
  name: "example-syntra-impl"
  version: "0.1.0"
  repository: "https://example.com/org/example-syntra-impl"
  languages: ["ExampleLang"]
  endpoints_tested: ["client", "server"]
syntra_core: v1
syntra_protocol: "1.0"
profiles:
  - SNTR-CORE-V1
  - SNTR-SESS-V1
  - SNTR-RPC-V1
  - SYNTRA-1.0-WSS
capabilities: []  # e.g. [syntra.update-recovery/1]; empty = mandatory-only
capability_rfcs: {}  # e.g. { syntra.update-recovery/1: "RFC-0006" }
bounds:
  max_frame_bytes: 1048576
  max_concurrent_rpcs: 16
  handshake_timeout_ms: 5000
  rpc_default_timeout_ms: 1000
  max_method_length: 256
  event_buffer_per_subscription: 0  # 0 = no event support (mandatory-only)
secure_transport_policy: "candidate encrypted TCP or verified TLS 1.3 WSS only for production; WS restricted to explicitly enabled trusted development environments"
results:
  - test_id: CONF-CORE-001
    verdict: NOT_EXECUTED
    reason: "template only; replace with retained execution evidence"
  - test_id: CONF-EVT-002
    verdict: NOT_EXECUTED
    reason: "template only; mandatory refusal probe not executed"
verdict_summary:
  PASS: 0
  FAIL: 0
  SKIP: 0
  UNSUPPORTED: 0
  NOT_EXECUTED: 2
notes:
  - "PASS reported only for executed cases with retained logs."
  - "SKIP/UNSUPPORTED and NOT_EXECUTED are not PASS; see conformance/README.md."
