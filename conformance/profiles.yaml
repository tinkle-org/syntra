# Syntra 1.0 test suite selectors, not implementation modules or wire tokens.
# Registration is not execution or review freeze.
format_version: "1.0"
syntra_version: "1.0"
core_wire_version: 1
protobuf_package: syntra.v1
specification: conformance/README.md
profiles:
  - id: SNTR-CORE-V1
    kind: MANDATORY_CORE
    title: "Syntra 1.0 core — envelopes, connection, RPC and security"
    required_for: every conformance claim
    manifests:
      - manifest/core.yaml
      - manifest/rpc.yaml
      - manifest/session.yaml
      - manifest/security.yaml
      - path: manifest/events.yaml
        select: { mandatory: true, capabilities: [] }
    vectors: [test-vectors/protobuf/vectors.yaml]
    claimable_alone: false
    notes: "Core/session/RPC identifiers and requirement IDs are stable; they are not carrier selection tokens. A claim also selects a canonical carrier below. Case prerequisites include an authenticated channel before core hello/ready; raw Frame bytes are not carrier bytes."

  - id: SNTR-SESS-V1
    kind: MANDATORY_CORE
    title: "Connection-bound sessions"
    required_for: every conformance claim
    manifests: [manifest/session.yaml]
    claimable_alone: false

  - id: SNTR-RPC-V1
    kind: MANDATORY_CORE
    title: "Correlation, cancellation, errors and retry discipline"
    required_for: every conformance claim
    manifests: [manifest/rpc.yaml]
    claimable_alone: false

  - id: SNTR-EVENTS-V1
    kind: OPTIONAL_CAPABILITY
    title: "Notification checks and negotiated update recovery"
    required_for: only declared capability claims
    manifests: [manifest/events.yaml, manifest/recovery.yaml]
    capabilities: [syntra.update-recovery/1]
    claimable_alone: false
    notes: "Only syntra.update-recovery/1 allocates a protocol capability here. Generic notification checks use explicit harness/application setup and allocate no event capability. An unclaimed capability yields SKIP/UNSUPPORTED, not PASS. Registration does not assert execution of any CONF-URP case."

  - id: SYNTRA-1.0-TCP
    kind: TRANSPORT_PROFILE
    title: "Syntra 1.0 encrypted TCP"
    carrier: 1
    binding: tcp-u16be
    domain: syntra.1.0
    manifests:
      - manifest/carrier-tcp.yaml
      - path: manifest/binding-policy.yaml
        select: { profile: SYNTRA-1.0-TCP }
      - path: manifest/connection.yaml
        select: { profile: SYNTRA-1.0-TCP }
    vectors: [test-vectors/connection/context-vectors.yaml]
    secure: true
    production_allowed: true
    notes: "u16BE length per M1/M2/ciphertext record; authenticated plaintext is an inner u32BE frame stream. No plaintext TCP fallback."

  - id: SYNTRA-1.0-WSS
    kind: TRANSPORT_PROFILE
    title: "Syntra 1.0 over verified TLS 1.3 WSS/H1"
    carrier: 3
    binding: websocket-h1-binary-verified-tls13
    domain: syntra.1.0
    endpoint: /syntra/1.0/ws
    subprotocol: syntra.1.0
    tls_minimum: "1.3"
    tls_termination: direct_host
    manifests:
      - path: manifest/connection.yaml
        select: { profile: SYNTRA-1.0-WSS }
      - path: manifest/binding-policy.yaml
        select: { profile: SYNTRA-1.0-WSS }
    vectors: [test-vectors/connection/context-vectors.yaml]
    secure: true
    production_allowed: true
    notes: "One reassembled binary message per M1/M2/record, no outer u16BE prefix. TLS chain/name validation and Noise pin validation are independent; no downgrade or forwarded-header inference."

  - id: SYNTRA-1.0-WS
    kind: TRANSPORT_PROFILE
    title: "Syntra 1.0 over restricted WS/H1"
    carrier: 2
    binding: websocket-h1-binary
    domain: syntra.1.0
    endpoint: /syntra/1.0/ws
    subprotocol: syntra.1.0
    manifests:
      - manifest/carrier-ws.yaml
      - path: manifest/binding-policy.yaml
        select: { profile: SYNTRA-1.0-WS }
      - path: manifest/connection.yaml
        select: { profile: SYNTRA-1.0-WS }
    vectors: [test-vectors/connection/context-vectors.yaml]
    secure: true
    production_allowed: false
    claim_label_suffix: "(restricted loopback development only)"
    notes: "The channel encrypts records, but this carrier has no verified outer TLS. Explicit opt-in and verified loopback target/peer confinement; never public production traffic."

claim_rules:
  - "Every claim includes SNTR-CORE-V1, SNTR-SESS-V1 and SNTR-RPC-V1 over at least one of the three canonical carrier profiles."
  - "Profile-filtered manifest references select only cases declaring that profile, including membership in a list-valued case profile. Capability gates still apply."
  - "Each selected case is executed independently for the claimed carrier and roles; WSS results cannot stand in for TCP or WS results."
  - "Production candidate claims may select encrypted TCP or verified TLS 1.3 WSS; WS is restricted. HTTP request/response and UDP have no canonical 1.0 binding."
  - "PASS requires retained per-case execution evidence. Registration, public context bytes and same-implementation tests do not prove independent interoperability or security review."
