# Portable recovery cases. Prose companion: ../recovery_profile/recovery.md (CONF-URP-001…009).
# Optionality rule: any case whose capabilities are unadvertised MUST yield
# UNSUPPORTED (correct UNIMPLEMENTED refusal) or SKIP — never FAIL.
format_version: "1.0"
profile: SNTR-EVENTS-V1
cases:
  - id: CONF-URP-001
    requirement: [SNTR-CAP-003, SNTR-EVENT-001, SNTR-EVENT-011]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session]
    input: {subscriptions: [{method: "/example.Events/Subscribe", filter_b64: "ZmlsdGVyLWE="}]}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: {code: UNIMPLEMENTED}
    notes: "Mandatory-only fallback: attempt without confirmed capability yields UNIMPLEMENTED with no batches and intact mandatory interop. Correct refusal reports UNSUPPORTED. SKIP when unclaimed."

  - id: CONF-URP-002
    requirement: [SNTR-EVENT-007, SNTR-REL-005]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed]
    input: {faults: {emit_duplicate_event: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      hygiene: {absent_from: [violation, error_storm]}
    notes: "Duplicate tolerance across the recovered and live boundary: initiator tolerates the duplicate with no violation and no error storm. SKIP when unclaimed."

  - id: CONF-URP-003
    requirement: [SNTR-EVENT-006, SNTR-EVENT-021]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed]
    input: {faults: {emit_batches: 3, skip_batch: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 0, body: notification}
    notes: "Gap detection by predecessor chaining without arithmetic on checkpoint bytes and without structural parsing; initiator requests recovery and host re-delivers the missing batch as a notification. Harness fault injection provides the gap. SKIP when unclaimed."

  - id: CONF-URP-004
    requirement: [SNTR-EVENT-008, SNTR-EVENT-009]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed]
    input: {replay: {cursor_b64: "Y3Vyc29yLUs=", strategy: subscribe_with_cursor}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 0, body: notification}
        - {request_id: 0, body: notification}
        - {request_id: 0, body: notification}
      hygiene: {absent_from: [unbounded_burst]}
    notes: "Replay paging: oversized history returns bounded pages with continuation marker and catch-up boundary, never burst beyond bounds. Expected frames are the bounded pages plus the catch-up boundary; hygiene forbids burst beyond bounds. Initiator follows the marker and stops at the boundary. SKIP when unclaimed."

  - id: CONF-URP-005
    requirement: [SNTR-EVENT-009]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, cursor_expired]
    input: {replay: {cursor_b64: "ZXhwaXJlZC1jdXJzb3I=", strategy: subscribe_with_cursor}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: {code: FAILED_PRECONDITION, message_pattern: snapshot}
      hygiene: {absent_from: [silent_restart]}
    notes: "Expired continuation with snapshot-required signal: replay from the expired checkpoint yields FAILED_PRECONDITION carrying the snapshot-required signal; the signal marker is required in the error detail so the case fails when the signal is absent. Recovery follows the snapshot path, never silent restart. SKIP when unclaimed."

  - id: CONF-URP-006
    requirement: [SNTR-EVENT-008]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed]
    input: {replay: {cursor_b64: "Y3Vyc29yLUs=", strategy: snapshot_from_boundary}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 1, body: result}
      hygiene: {absent_from: [partial_install]}
    notes: "Snapshot install gate: offer under provider-proven boundary transfers bounded pages the initiator stores without interpreting. Expected result confirms the boundary checkpoint; install completes only on boundary confirm with no partial install. SKIP when unclaimed."

  - id: CONF-URP-007
    requirement: [SNTR-SESS-008, SNTR-EVENT-020]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [transport_connected]
    input:
      frames:
        - {request_id: 0, body: hello, min_version: 1, max_version: 1}
      subscriptions:
        - {method: "/example.Events/Subscribe", filter_b64: "ZmlsdGVyLWE=", handle_b64: "c3RhbGUtaGFuZGxl"}
    expected:
      connection_state: ACTIVE
      session_state: active
      hygiene: {absent_from: [notification]}
    notes: "Reconnect re-subscribe: new connection carries no batches without explicit re-subscribe; stale-handle subscribe attempt carries no continuity without negotiated recovery. Expected hygiene forbids notification batches. SKIP when unclaimed."

  - id: CONF-URP-008
    requirement: [SNTR-EVENT-030, SNTR-REL-007]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed, flood_ready]
    input: {faults: {flood_events: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: {code: RESOURCE_EXHAUSTED}
      hygiene: {absent_from: [unbounded_queue, silent_truncation]}
    notes: "Overflow reject-new-work outcome, runnable only when the host documents the reject-new-work policy (SKIP CONF-URP-008 otherwise; SKIP CONF-URP-009 when this policy holds). Saturation yields RESOURCE_EXHAUSTED with documented backoff. Conditional alternative is CONF-URP-009 explicit continuity loss with a new generation; satisfying either CONF-URP-008 or CONF-URP-009 satisfies the overflow requirement. Never unbounded queueing and never silent truncation without the documented signal. SKIP when unclaimed."

  - id: CONF-URP-009
    requirement: [SNTR-EVENT-030, SNTR-REL-007]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed, flood_ready]
    input: {faults: {flood_events: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 0, body: notification, payload_b64: "Y29udGludWl0eS1sb3NzIGdlbi04"}
      hygiene: {absent_from: [unbounded_queue, silent_truncation]}
    notes: "Overflow continuity-loss outcome, runnable only when the host documents the continuity-loss policy (SKIP CONF-URP-009 otherwise; SKIP CONF-URP-008 when this policy holds). Saturation ends only the affected stream with an observable notification carrying the explicit continuity-loss signal and a new generation; the expected payload carries that signal so a normal batch does not pass. Conditional alternative is CONF-URP-008 RESOURCE_EXHAUSTED; satisfying either CONF-URP-008 or CONF-URP-009 satisfies the overflow requirement. Never unbounded queueing and never silent truncation without the documented signal. SKIP when unclaimed."
