# Portable core/envelope cases (Section E). Profile: SNTR-CORE-V1. All Mandatory.
# Protocol owners: specifications/wire-format.md and specifications/connection.md.
# Test authoring and evidence: conformance/README.md.
format_version: "1.0"
profile: SNTR-CORE-V1
cases:
  - id: CONF-CORE-001
    requirement: [SNTR-WIRE-001, SNTR-WIRE-002, SNTR-RPC-002, SNTR-RPC-003, SNTR-RPC-006]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 7, body: request, method: "/example.Echo/Echo", payload_b64: "aGVsbG8=", timeout_ms: 500 }
        - { request_id: 8, body: request, method: "/example.Echo/Echo", payload_b64: "", timeout_ms: 500 }
        - { request_id: 9, body: request, method: "/example.KV/Get", payload_b64: "AAEC//8=", timeout_ms: 500 }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - { request_id: 7, body: result, payload_b64: "aGVsbG8=" }
        - { request_id: 8, body: result, payload_b64: "" }
        - { request_id: 9, body: result, payload_b64: "AAEC//8=" }
    notes: "Valid request/result envelopes over one active connection. Empty and arbitrary non-UTF-8 payloads are meaningful, not errors. Hello/ready validity is exercised by CONF-SESS-001; notification isolation by CONF-EVT-005 and CONF-EVT-014."
    vector_refs: ["protobuf/GOLD-PROT-REQ-01", "protobuf/GOLD-PROT-RES-OK-01"]

  - id: CONF-CORE-002
    requirement: [SNTR-WIRE-002, SNTR-WIRE-003, SNTR-ERR-003]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { raw_b64: "CAEQBA==" }  # Frame{version:1, request_id:4} with no body set (bodyless envelope)
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: INVALID_ARGUMENT }
      hygiene: { absent_from: [credential, token, stack, ".pem", SELECT] }
    notes: "Invalid envelope (empty body) rejected before dispatch; connection stays usable in ACTIVE."

  - id: CONF-CORE-003
    requirement: [SNTR-SER-003, SNTR-SER-004]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 7, body: request, method: "/example.Echo/Echo", payload_b64: "aGk=", timeout_ms: 500, unknown_fields: [{ number: 90, wire_type: 2, value_b64: "eA==" }] }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - { request_id: 7, body: result, payload_b64: "aGk=" }
    notes: "Unknown Protobuf metadata field 90 is tolerated and skipped; mandatory interop is unaffected. This does not permit unknown body discriminators. Unknown fields are harness-injected, not emitted by conforming senders."

  - id: CONF-CORE-004
    requirement: [SNTR-ERR-005, SNTR-ERR-010]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { inject_raw_result_error_code: 99, request_id: 7 }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: UNKNOWN, message_pattern: "NEGATIVE:panic" }
    notes: "Codec-level fixture: synthetic RpcError with future numeric code 99 maps to UNKNOWN for application reporting, preserves the number diagnostically where possible, and never crashes or reports success."

  - id: CONF-CORE-005
    requirement: [SNTR-HS-003, SNTR-HS-010, SNTR-VER-002]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 0, body: hello, min_version: 2, max_version: 3 }
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNIMPLEMENTED, observer: detecting_host, carriage: local_only }
      frames: []
      transport:
        peer_observation:
          tcp_tls: { signal: transport_close, local_report: UNAVAILABLE }
          ws_wss: { signal: ws_close, local_report: generic_protocol_rejection }
    notes: "Disjoint version range against a v1-only host. The detecting host records local UNIMPLEMENTED and closes; local_only plus frames: [] forbids RpcResult, error-bearing ready and zero-ID error Frames. The peer sees native termination: TCP reports UNAVAILABLE absent better local evidence; WS/WSS observes Close without a guaranteed code and reports generic protocol rejection, never the host's private exact cause. No credential evaluation or downgrade retry. Repeat with low-only and high-only ranges."

  - id: CONF-CORE-006
    requirement: [SNTR-CAP-002, SNTR-CAP-004, SNTR-CAP-011]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 0, body: hello, min_version: 1, max_version: 1 }
    expected:
      connection_state: ACTIVE
      session_state: active
    notes: "Handshake carries no capability or test-selector terms: a mandatory-only hello against a full host reaches ACTIVE. Optional-capability state cannot fail the handshake. Harness authentication policy permits the supplied credentials. Recovery negotiation isolation is exercised by CONF-URP-001. Contrast CONF-CORE-007."

  - id: CONF-CORE-007
    requirement: [SNTR-CAP-002, SNTR-CAP-011]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 21, body: request, method: "/example.Echo/Echo", payload_b64: "eA==", timeout_ms: 500 }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - { request_id: 21, body: result, payload_b64: "eA==" }
    notes: "Mandatory-only RPC completes with a correlated successful RpcResult and exact echoed payload on a connection with no confirmed optional protocol. Support is never assumed and no extension frames are sent. Recovery operations before Negotiate confirmation are refused with UNIMPLEMENTED under its own contract (CONF-URP-001, SYN-URP-010). Contrast CONF-CORE-006."

  - id: CONF-CORE-008
    requirement: [SNTR-HS-012, SNTR-CORE-011, SNTR-WIRE-003]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [handshake_started]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 7, body: request, method: "/example.Echo/Echo", payload_b64: "aGk=", timeout_ms: 500 }
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: FAILED_PRECONDITION, message_pattern: "NEGATIVE:result" }
    notes: "Request before ACTIVE fails the handshake and closes with no dispatch and no zero-request_id result. Repeat with second hello and pre-ACTIVE cancel/notification."

  - id: CONF-CORE-009
    requirement: [SNTR-CORE-030, SNTR-WIRE-003, SNTR-RPC-001]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 0, body: request, method: "/example.Echo/Echo", payload_b64: "aGk=", timeout_ms: 500 }
        - { request_id: 11, body: request, method: "example.Echo", payload_b64: "aGk=", timeout_ms: 500 }
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: INVALID_ARGUMENT }
    notes: "Zero request_id with request is connection-level (close); malformed method shape is per-RPC INVALID_ARGUMENT. Harness runs both rows; the zero-ID row determines the terminal state."

  - id: CONF-CORE-011
    requirement: [SNTR-SER-008A, SNTR-SER-003]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session, fresh_request_id_high_water]
    input:
      frames:
        - { raw_b64: "CAIIARAGEAdiHgoSL2V4YW1wbGUuRWNoby9FY2hvEgVoZWxsbxj0Aw==" }
        - { raw_b64: "CAEQB3ICCAE=" }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - { request_id: 7, body: result, payload_b64: "aGVsbG8=" }
    notes: "Registered, not executed. First frame has version scalars 2 then 1 and request_id scalars 6 then 7: the merged valid request dispatches exactly once under ID 7, never 6. After its result, the late Cancel for 7 contains well-formed unknown inner field 1; it has no further effect or result and leaves the connection usable. This does not permit duplicate bodies or wrong wire types. Raw fixtures enter authenticated plaintext, not the carrier directly."

  - id: CONF-CORE-010
    requirement: [SNTR-HS-006, SNTR-HS-013, SNTR-SESS-004]
    profile: SNTR-CORE-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      transport: { action: graceful_close, stop_new_rpcs: true }
    expected:
      connection_state: CLOSED
      session_state: terminated_normally
    notes: "Graceful close: no new RPCs, observe the bounded grace period, teardown CLOSING->CLOSED, in-flight RPCs get UNAVAILABLE or CANCELLED, and per-connection state is discarded."
