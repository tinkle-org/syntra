# Generic notification/refusal tests. Selector: SNTR-EVENTS-V1.
# Protocol owners: specifications/rpc.md and specifications/recovery.md.
# Application subscription fixtures allocate no protocol capability. The
# negotiated recovery protocol has its own cases in recovery.yaml.
format_version: "1.0"
profile: SNTR-EVENTS-V1
cases:
  - id: CONF-EVT-002
    requirement: [SNTR-CAP-003, SNTR-EVENT-001, SNTR-EVENT-011]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    input: { subscriptions: [{ method: "/example.Events/Subscribe", filter_b64: "ZmlsdGVyLWE=" }] }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: UNIMPLEMENTED }
    notes: "Mandatory-only host without this application-defined subscription method returns UNIMPLEMENTED, emits no events, and preserves RPC interop. A correct refusal reports UNSUPPORTED, not capability support."

  - id: CONF-EVT-005
    requirement: [SNTR-EVENT-007, SNTR-REL-005]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    input: { faults: { emit_duplicate_event: true } }
    expected: { connection_state: ACTIVE, session_state: unchanged }
    notes: "Duplicate notification tolerance: initiator tolerates the duplicate without a protocol violation or error storm. Delivery effects remain subject to the application stream contract."

  - id: CONF-EVT-010
    requirement: [SNTR-EVENT-004, SNTR-SESS-004, SNTR-REL-009]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session, subscription_confirmed]
    input: { faults: { abrupt_transport_loss: true, in_flight_request_ids: [9] } }
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
    notes: "Harness establishes an application-defined subscription. Loss ends it; in-flight RPCs get UNAVAILABLE with unknown outcome; no continuity assumed."

  - id: CONF-EVT-011
    requirement: [SNTR-SESS-008, SNTR-EVENT-020]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      frames:
        - { request_id: 0, body: hello, min_version: 1, max_version: 1 }
    expected: { connection_state: ACTIVE, session_state: active }
    notes: "Reconnect requires explicit re-subscribe: no events arrive without it; a fresh connection does not restore application subscription state."

  - id: CONF-EVT-012
    requirement: [SNTR-EVENT-011]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    input: { subscriptions: [{ method: "/example.Events/Subscribe", filter_b64: "dW5rbm93bi10b3BpYw==" }] }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: UNIMPLEMENTED }
    notes: "Unknown application subscription method/stream returns UNIMPLEMENTED; no silent ignore or unrelated events."

  - id: CONF-EVT-014
    requirement: [SNTR-EVENT-005]
    profile: SNTR-EVENTS-V1
    roles: [client]
    capabilities: []
    mandatory: true
    preconditions: [handshake_started]
    input: { faults: { emit_preactive_notification: true } }
    expected: { connection_state: CLOSED, session_state: none, error: { code: FAILED_PRECONDITION }, hygiene: { absent_from: [queue, subscription_state] } }
    notes: "Client role only: the controlled host sends the pre-ACTIVE notification. The initiator records local FAILED_PRECONDITION, discards the notification without application delivery or subscription state, and proceeds CLOSING then CLOSED. The peer observes only the native close; no error Frame crosses the wire. Registered; not executed."

  - id: CONF-EVT-015
    requirement: [SNTR-CORE-001, SNTR-CORE-002]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session, subscription_confirmed]
    input: { faults: { emit_events: 1 } }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      hygiene: { absent_from: [chat, receipt, presence, typing] }
    notes: "Harness establishes a neutral application-defined stream. Payloads remain opaque bytes; inspect fixtures, wire traces and logs for domain-specific assumptions."
