      connection_state: CLOSED
      session_state: none
      error: { code: UNAUTHENTICATED }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "Issuance negatives: entropy failure aborts before any staged record; degenerate AKs, collisions, duplicate and concurrent issuance are refused with no overwrite, no adoption of another principal's record, no second authorization for a live (handle, epoch) tuple and no post-issuance key substitution. Statistical samples never prove entropy quality (SNTR-SC-005)."

  - id: CONF-SCW-027
