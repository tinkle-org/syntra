# Syntra 1.0 channel tests. Protocol owners: specifications/transports.md and
# specifications/security.md. Case IDs identify tests, not carrier aliases.
# Every row is registered and not executed; conformance/README.md owns evidence.
format_version: "1.0"
profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
cases:
  - id: CONF-SCW-001
    requirement: [SNTR-SCW-001, SNTR-SC-013, SNTR-WS-001, SNTR-WS-010, SNTR-WS-020]
    profile: SYNTRA-1.0-WS
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: websocket_upgrade
        path: /syntra/1.0/ws
        subprotocol: syntra.1.0
        carrier: 2
    expected:
      connection_state: CONNECTED
      session_state: none
      transport: { upgrade_status: 101, subprotocol: syntra.1.0, compression: disabled }
    notes: "Positive selection. Separate negative runs use a wrong endpoint path and an unsupported subprotocol token; each fails without channel bytes or fallback."

  - id: CONF-SCW-043
    requirement: [SNTR-SCW-001, SNTR-SC-013, SNTR-WSS-001, SNTR-WSS-010, SNTR-WSS-020]
    profile: SYNTRA-1.0-WSS
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: websocket_upgrade
        path: /syntra/1.0/ws
        subprotocol: syntra.1.0
        carrier: 3
    expected:
      connection_state: CONNECTED
      session_state: none
      transport: { upgrade_status: 101, subprotocol: syntra.1.0, compression: disabled }
    notes: "Positive WSS selection. Separate negative runs use a wrong endpoint path and an unsupported subprotocol token; each fails without channel bytes or fallback."

  - id: CONF-SCW-002
    requirement: [SNTR-SCW-002, SNTR-SC-003]
    profile: SYNTRA-1.0-WSS
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain]
    input:
      transport:
        action: channel_handshake
        contexts: [SYNTRA-CONTEXT-02, SYNTRA-CONTEXT-04]
        vectors: conformance/test-vectors/connection/context-vectors.yaml
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { context_matches: true, prologue_matches: true, carrier: 3 }
    notes: "Exact WSS context/prologue bytes for bootstrap and returning modes, including multibyte UTF-8 scope. The context MUST equal the prologue and the M1 prefix. SYNTRA-CONTEXT-03 is exercised as a carrier-mismatch rejection in CONF-SCW-017."

  - id: CONF-SCW-003
    requirement: [SNTR-SCW-003, SNTR-SC-001, SNTR-SC-004, SNTR-SC-005]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, verified_noise_pin]
    input:
      transport:
        action: channel_handshake
        m1_bytes: [83, 337]
        m2_bytes: 48
        payloads: empty
        modes: [bootstrap, returning]
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { handshake_payload_bytes: 0, fresh_ephemeral: true }
    notes: "Both modes. Non-empty handshake payloads, unexpected lengths, wrong PSK and wrong suite fail with no protected dispatch."

  - id: CONF-SCW-004
    requirement: [SNTR-SCW-004, SNTR-TSEC-003, SNTR-TSEC-004, SNTR-WSS-001, SNTR-WSS-003, SNTR-WSS-041, SNTR-WSS-051, SNTR-WSS-200, SNTR-WSS-201]
    profile: SYNTRA-1.0-WSS
    roles: [client]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, invalid_chain]
    input:
      transport:
        action: tls_connect
        pki: test-pki-wrong-host
        noise_pin: wrong-key
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "TLS identity failure and Noise pin failure are independent terminal failures. No hello, credential or fallback. Repeat with a valid chain and wrong pin."

  - id: CONF-SCW-005
    requirement: [SNTR-SCW-005, SNTR-SC-007, SNTR-WS-030, SNTR-WS-031, SNTR-WS-032, SNTR-WS-033, SNTR-WS-034, SNTR-WS-036, SNTR-WS-201, SNTR-WSS-030, SNTR-WSS-031]
    profile: [SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: send_ws_messages
        message_kinds: [binary, fragmented_binary]
        records_per_message: 1
        outer_length: none
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      transport: { binary_accepted: true, fragments_reassembled: true, outer_length: none }
    notes: "Success path only: active-session protected records. One reassembled binary message per record, with no u16BE outer length prefix. Ping/Pong/Close never complete an RPC or confirm a channel. Non-binary and malformed messages are covered by CONF-SCW-019; pre-session fragmented M1/M2 coverage is CONF-SCW-021."

  - id: CONF-SCW-021
    requirement: [SNTR-SCW-003, SNTR-SCW-005, SNTR-WS-030, SNTR-WS-033, SNTR-WS-034, SNTR-WS-036, SNTR-WS-201, SNTR-WSS-030, SNTR-WSS-031]
    profile: [SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, handshake_started, verified_tls_when_wss]
    input:
      transport:
        action: send_ws_messages
        message_kinds: [fragmented_m1, fragmented_m2]
        records_per_message: 1
        outer_length: none
        phase: pre_ready
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { fragments_reassembled: true, handshake_messages_intact: true }
    notes: "Pre-session-activation probe: fragmented M1 and M2 are each reassembled into one binary message before Noise processing. This is separate from the active-session protected-record success path in CONF-SCW-005."

  - id: CONF-SCW-006
    requirement: [SNTR-SCW-006, SNTR-SC-013, SNTR-WS-013, SNTR-WS-020, SNTR-WS-021, SNTR-WS-022, SNTR-WS-051, SNTR-WS-052, SNTR-WS-200, SNTR-WS-202, SNTR-WS-210, SNTR-WSS-012, SNTR-WSS-020, SNTR-WSS-051, SNTR-WSS-200, SNTR-WSS-201, SNTR-WSS-210]
    profile: [SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: websocket_upgrade
        path: /syntra/1.0/ws
        headers: { Authorization: "Bearer fixture", Cookie: "session=fixture" }
        origin: "https://fixture.invalid"
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { upgrade_status: 400 }
      hygiene: { absent_from: [fixture, credential, token] }
    notes: "Authorization and Cookie are rejected. Origin and forwarded headers are not authentication. No Syntra credential in the Upgrade. Repeat with a missing/wrong subprotocol. Client-side rejection of an invalid 101/Sec-WebSocket-Accept response without sending M1 is CONF-SCW-024."

  - id: CONF-SCW-024
    requirement: [SNTR-SCW-006, SNTR-WS-013, SNTR-WS-200, SNTR-WS-202, SNTR-WSS-012, SNTR-WSS-200, SNTR-WSS-201]
    profile: [SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: websocket_upgrade
        path: /syntra/1.0/ws
        subprotocol: syntra.1.0
        server_response: { upgrade_status: 101, sec_websocket_accept: invalid }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { upgrade_response_validated: true, m1_sent: false }
      hygiene: { absent_from: [credential, token] }
    notes: "Client-side validation: a 101 response whose Sec-WebSocket-Accept is invalid causes the client to close with no M1 and no Noise material. Host-side rejection with HTTP 400 of forbidden request headers is CONF-SCW-006."

  - id: CONF-SCW-007
    requirement: [SNTR-SCW-007, SNTR-TSEC-008, SNTR-WSS-114, SNTR-WSS-211, SNTR-WSS-220]
    profile: SYNTRA-1.0-WSS
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: websocket_upgrade
        terminated_by: proxy
        forwarded_proto: https
        forwarded_for: "203.0.113.7"
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
    notes: "Direct verified TLS termination by the host is the initial permitted topology. Proxy termination and forwarded carrier claims are refused. Do not infer carrier 3 from a header."

  - id: CONF-SCW-008
    requirement: [SNTR-SCW-008, SNTR-SC-013]
    profile: [SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: connect, carrier: 2, production_claim: true }
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
    notes: "WS is restricted development only and disabled by default in production-claiming distributions. Encrypted TCP is production-allowed; it does not become carrier 3."

  - id: CONF-SCW-009
    requirement: [SNTR-SCW-009, SNTR-SC-007]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: channel_record
        plaintext_bytes: [1, 65519]
        ciphertext_bytes: [17, 65535]
        associated_data: empty
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      transport: { max_plaintext: 65519, max_ciphertext: 65535, ad_empty: true }
    notes: "Success path only: boundary record sizes and empty AD. Oversize, truncated-tag and non-empty-AD rejection is covered by CONF-SCW-020. Carrier headers are not authenticated AD."

  - id: CONF-SCW-010
    requirement: [SNTR-SCW-010, SNTR-SC-008, SNTR-WS-036, SNTR-WSS-031]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: channel_stream
        frame_bytes: [32, 1048576]
        frame_1048577: reject
        splits: every_record_boundary
        coalesced_frames: true
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      transport: { frames_dispatched_once: true, partial_dispatch: false }
    notes: "Construct valid role-appropriate envelopes of each indicated serialized size. Prefixes and frames may span records; multiple complete frames may share a record. One-byte plaintext fragments are record fragments, not complete envelopes. No resynchronization, partial decode or allocation above the declared bound."

  - id: CONF-SCW-011
    requirement: [SNTR-SCW-011, SNTR-SC-006, SNTR-DAUTH-010, SNTR-WS-001, SNTR-WS-040, SNTR-WS-041, SNTR-WS-050, SNTR-WS-200, SNTR-WS-210, SNTR-WS-211, SNTR-WSS-001, SNTR-WSS-040, SNTR-WSS-041, SNTR-WSS-050, SNTR-WSS-200, SNTR-WSS-210]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, verified_noise_pin]
    input:
      transport:
        action: channel_first_envelope
        envelope: one_complete_hello
        may_span_records: true
        trailing_envelope: none
        extra_complete_envelope: reject
        extra_partial_envelope: reject
    expected:
      connection_state: ACTIVE
      session_state: active
      frames:
        - { request_id: 0, body: ready }
    notes: "The record completing the hello ends at its boundary. No protected dispatch or sensitive output before hello validation, current-enrollment/same-principal policy and ready. A replayed M1 confirms nothing."

  - id: CONF-SCW-012
    requirement: [SNTR-SCW-012, SNTR-SC-009, SNTR-SC-011, SNTR-SC-012, SNTR-SC-014, SNTR-DAUTH-009, SNTR-WS-120, SNTR-WS-202, SNTR-WSS-120, SNTR-WSS-201]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session, connection_lost]
    input:
      transport:
        action: channel_limits
        lifetime_s: 86400
        records_per_direction: 4294967296
        writer_stall: true
        reconnect: fresh_handshake
        replay: none
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      retry: "fresh-handshake-only"
    notes: "Counter/lifetime exhaustion closes without wrapping. A stalled writer aborts or completes within budget and never re-encrypts a consumed nonce. Reconnect uses fresh keys and does not replay RPCs or resume the session."

  - id: CONF-SCW-013
    requirement: [SNTR-SCW-002, SNTR-SC-003, SNTR-SC-010]
    profile: SYNTRA-1.0-TCP
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: channel_context_negatives
        recipes: [SYNTRA-N01, SYNTRA-N02, SYNTRA-N03, SYNTRA-N04, SYNTRA-N05, SYNTRA-N13, SYNTRA-N07, SYNTRA-N08, SYNTRA-N09, SYNTRA-N10, SYNTRA-N11, SYNTRA-N14]
        vectors: conformance/test-vectors/connection/context-vectors.yaml
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "For each recipe, configure the responder to accept its declared TCP base (mode, server-key selector, scope and enrollment) before applying only that mutation; no implicit base replacement. Unsupported domain/format, zero mode, unknown carrier, bootstrap epoch, zero returning handle, empty/oversize/truncated/trailing/invalid-UTF-8 scope and character-count length all fail before Noise or credential lookup."

  - id: CONF-SCW-044
    requirement: [SNTR-SCW-002, SNTR-SC-003, SNTR-SC-010]
    profile: SYNTRA-1.0-WS
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: channel_context_negatives
        recipes: [SYNTRA-N15, SYNTRA-N16, SYNTRA-N17, SYNTRA-N18, SYNTRA-N19, SYNTRA-N06, SYNTRA-N20, SYNTRA-N21, SYNTRA-N22, SYNTRA-N23, SYNTRA-N24, SYNTRA-N25]
        vectors: conformance/test-vectors/connection/context-vectors.yaml
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "The same twelve mutations as CONF-SCW-013, each applied only after configuring the responder to accept its declared WS base (mode, server-key selector, scope and enrollment). Bases already encode carrier 2; no implicit base replacement or unrelated carrier mismatch. All fail before Noise or credential lookup."

  - id: CONF-SCW-045
    requirement: [SNTR-SCW-002, SNTR-SC-003, SNTR-SC-010]
    profile: SYNTRA-1.0-WSS
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: channel_context_negatives
        recipes: [SYNTRA-N26, SYNTRA-N27, SYNTRA-N28, SYNTRA-N29, SYNTRA-N30, SYNTRA-N31, SYNTRA-N32, SYNTRA-N33, SYNTRA-N34, SYNTRA-N35, SYNTRA-N36, SYNTRA-N12]
        vectors: conformance/test-vectors/connection/context-vectors.yaml
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "The same twelve mutations as CONF-SCW-013, each applied only after configuring the responder to accept its declared WSS base (mode, server-key selector, scope and enrollment). Bases already encode carrier 3; no implicit base replacement or unrelated carrier mismatch. All fail before Noise or credential lookup."

  - id: CONF-SCW-014
    requirement: [SNTR-SC-004, SNTR-SC-006, SNTR-SC-010, SNTR-DAUTH-008, SNTR-WS-001, SNTR-WS-040, SNTR-WS-041, SNTR-WS-052, SNTR-WS-200, SNTR-WS-210, SNTR-WSS-001, SNTR-WSS-040, SNTR-WSS-041, SNTR-WSS-051, SNTR-WSS-200, SNTR-WSS-210]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, handshake_started]
    input:
      transport:
        action: channel_replay
        replay_m1: true
        omit_m2: true
        corrupt_m2: true
        pre_ready_request: true
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token] }
    notes: "Replayed M1 may elicit a bounded M2 but MUST NOT invoke host policy, bind a principal or dispatch. No hello/credential before verified M2; no protected request before ready."

  - id: CONF-SCW-015
    requirement: [SNTR-DAUTH-001, SNTR-DAUTH-003]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      credentials: "fixture:channel-preprovisioned"
      transport:
        action: channel_key_validation
        ak_bytes: 32
        zero_ak: reject
        zero_handle_returning: reject
        zero_epoch_returning: reject
        handle_collision: reject
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAUTHENTICATED }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "AK is 32 random bytes and enters only the PSK input. Handle is eight opaque bytes, independent of the key and principal. Collisions fail or are resolved by the documented bounded procedure."

  - id: CONF-SCW-016
    requirement: [SNTR-DAUTH-005, SNTR-DAUTH-010, SNTR-WS-050, SNTR-WS-211, SNTR-WSS-050]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, verified_noise_pin]
    input:
      credentials: "fixture:channel-principal"
      transport:
        action: channel_policy
        enrollment_principal: principal-a
        channel_principal: principal-b
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: PERMISSION_DENIED }
      hygiene: { absent_from: [credential, token] }
    notes: "Returning policy principal differing from the trusted enrollment principal fails before ready; no privilege union, ready or protected effect. Empty credentials never select the channel principal. Denied-method-after-ready behavior is CONF-SCW-018."

  - id: CONF-SCW-017
    requirement: [SNTR-SCW-002, SNTR-SC-003, SNTR-SC-010]
    profile: SYNTRA-1.0-WSS
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain]
    input:
      transport:
        action: channel_handshake
        contexts: [SYNTRA-CONTEXT-03]
        vectors: conformance/test-vectors/connection/context-vectors.yaml
        expected_carrier: 3
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
    notes: "SYNTRA-CONTEXT-03 encodes carrier 2 (WS). Under SYNTRA-1.0-WSS the responder requires carrier 3 and MUST reject this context before Noise or credential lookup. This vector is a negative case for this profile, not a WSS success vector."

  - id: CONF-SCW-018
    requirement: [SNTR-DAUTH-005, SNTR-DAUTH-010, SNTR-WS-211]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      credentials: "fixture:channel-principal"
      transport:
        action: channel_method_denial
        principal: principal-a
        method: "/example.Admin/Reset"
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: PERMISSION_DENIED }
      hygiene: { absent_from: [credential, token] }
    notes: "After ready, a denied method returns one terminal PERMISSION_DENIED result, has no handler effect and leaves the connection usable. This is distinct from the pre-ready principal mismatch in CONF-SCW-016."

  - id: CONF-SCW-019
    requirement: [SNTR-SCW-005, SNTR-SC-007, SNTR-SC-010, SNTR-WS-030, SNTR-WS-031, SNTR-WS-032, SNTR-WS-081, SNTR-WS-090, SNTR-WS-091, SNTR-WS-092, SNTR-WS-220, SNTR-WSS-030, SNTR-WSS-081, SNTR-WSS-090, SNTR-WSS-220]
    profile: [SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: send_ws_messages
        message_kinds: [text, compressed, empty, truncated]
        records_per_message: 1
        outer_length: none
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
      transport: { text_rejected: true, compressed_rejected: true, empty_rejected: true, truncated_rejected: true }
    notes: "Rejection path only: text, compressed, empty and truncated messages fail without protected dispatch. Binary and fragmented success is CONF-SCW-005."

  - id: CONF-SCW-020
    requirement: [SNTR-SCW-009, SNTR-SC-007, SNTR-SC-010]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: channel_record
        plaintext_bytes: 65520
        ciphertext_bytes: 65536
        tag: full
        associated_data: empty
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
    notes: "Isolates the oversize condition: an otherwise valid record with plaintext 65,520 and ciphertext 65,536 fails closed. Boundary-size success with empty AD is CONF-SCW-009."

  - id: CONF-SCW-022
    requirement: [SNTR-SCW-009, SNTR-SC-007, SNTR-SC-010]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: channel_record
        plaintext_bytes: 1
        ciphertext_bytes: 17
        truncated_tag: true
        associated_data: empty
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
    notes: "Isolates the truncated-tag condition: size bounds and AD are otherwise valid; the record fails closed."

  - id: CONF-SCW-023
    requirement: [SNTR-SCW-009, SNTR-SC-007, SNTR-SC-010]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: channel_record
        plaintext_bytes: 1
        ciphertext_bytes: 17
        tag: full
