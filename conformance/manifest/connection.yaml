  # ---- Device authorization lifecycle: specifications/security.md ----
  # Host-store and device observations supplement the protected channel tests.
  # These fixtures define no wire field or Frame variant and assert no execution.

  - id: CONF-SCW-025
    requirement: [SNTR-DAUTH-011]
    profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WS, SYNTRA-1.0-WSS]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture]
    input:
      transport:
        action: channel_enrollment_attempt
        authority_paths: [authorized_bootstrap]
        denied_variants: [anonymous, unauthenticated_enroller]
        target_principal: principal-a
        scope: fixture-endpoint/scope
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAUTHENTICATED }
      hygiene: { absent_from: [credential, token] }
    notes: "Protected-channel enrollment denials, one fixture run per variant: anonymous and unauthenticated enrollers are denied before any material is issued, staged or durably recorded; zero durable records, zero protected effects, and the device retains no state that later authenticates. UNAUTHENTICATED applies to these authentication failures; valid-but-unauthorized credentials are the distinct rows below. Authorized-path validation and its bounded audit trail require separate success evidence; the equivalent out-of-band denial path is CONF-SCW-039."

  - id: CONF-SCW-026
    requirement: [SNTR-DAUTH-012]
