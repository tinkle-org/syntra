# Candidate executable specifications, not execution results.
format_version: "1.0"
profile: SYNTRA-1.0-TCP
cases:
  - id: CONF-SCT-001
    requirement: [SNTR-SC-003, SNTR-SCW-002, SNTR-SCW-008, SNTR-TCP-001, SNTR-TCP-002, SNTR-TCP-003, SNTR-TCP-007, SNTR-TCP-008]
    profile: SYNTRA-1.0-TCP
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, verified_noise_pin, provisioned_returning_key]
    input:
      transport:
        action: channel_handshake
        carrier: 1
        contexts: [SYNTRA-CONTEXT-01, SYNTRA-CONTEXT-05]
        vectors: conformance/test-vectors/connection/context-vectors.yaml
        outer_length: u16be
        production_claim: true
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { context_matches: true, prologue_matches: true, carrier: 1, production_allowed: true }
    notes: "One run per mode, with verified confirmation, hello and ready. Encrypted TCP is production-allowed; success is not plaintext fallback."

  - id: CONF-SCT-002
    requirement: [SNTR-SC-007, SNTR-TCP-004, SNTR-TCP-006]
    profile: SYNTRA-1.0-TCP
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, verified_noise_pin]
    input:
      transport:
        action: tcp_message_boundaries
        phases: [m1, m2, protected_record]
        outer_length: u16be
        split_positions: every_byte
        coalesce_messages: true
        modes: [bootstrap, returning]
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { messages_delivered_once: true, partial_dispatch: false, prefix_in_noise_input: false }
    notes: "Reassemble exact u16BE-delimited messages before Noise; segmentation and coalescing do not change message boundaries. The inner u32BE frame prefix is protected plaintext, never a TCP handshake prefix."

  - id: CONF-SCT-003
    requirement: [SNTR-SC-010, SNTR-SCW-003, SNTR-TCP-005, SNTR-TCP-006, SNTR-TCP-008]
    profile: SYNTRA-1.0-TCP
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: tcp_malformed_messages
        variants: [zero_outer_length, truncated_u16be, truncated_body, m1_below_83, m1_above_337, m2_not_48, plaintext_core_hello, unsupported_context_domain]
        one_variant_per_run: true
    expected:
      connection_state: CLOSED
      session_state: none
      frames: []
      transport: { protected_dispatch: false, fallback: false }
    notes: "EOF terminates incomplete prefix/body variants. A handshake-sized bound is checked before allocating a declared over-limit M1/M2. No resynchronization or plaintext negotiation."

  - id: CONF-SCT-004
    requirement: [SNTR-SC-003, SNTR-SC-010, SNTR-SCW-002]
    profile: SYNTRA-1.0-TCP
    roles: [server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: channel_handshake
        contexts: [SYNTRA-CONTEXT-02, SYNTRA-CONTEXT-03]
        vectors: conformance/test-vectors/connection/context-vectors.yaml
        expected_carrier: 1
    expected:
      connection_state: CLOSED
      session_state: none
      frames: []
      transport: { rejected_before_noise: true, credential_lookup: false }
    notes: "Each non-TCP context is an independent rejection probe; a WS/WSS result is not TCP evidence."

  - id: CONF-SCT-005
    requirement: [SNTR-SC-007, SNTR-SC-008, SNTR-SCW-009, SNTR-SCW-010, SNTR-TCP-004, SNTR-TCP-005, SNTR-TCP-006]
    profile: SYNTRA-1.0-TCP
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    input:
      transport:
        action: tcp_protected_stream
        outer_length: u16be
        inner_length: u32be
        ciphertext_bytes: [17, 65535]
        frame_bytes: [32, 1048576]
        split_inner_prefix: true
        split_inner_frame: true
        coalesce_frames: true
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      transport: { frames_dispatched_once: true, partial_dispatch: false, ad_empty: true }
    notes: "Construct valid role-appropriate envelopes of each indicated serialized size. Length bounds refer to carrier ciphertext and serialized inner Frame respectively, not to interchangeable units. A 17-byte ciphertext carries a one-byte plaintext fragment, not a complete one-byte Frame."

  - id: CONF-SCT-006
    requirement: [SNTR-SC-007, SNTR-SC-008, SNTR-SC-010, SNTR-TCP-005, SNTR-TCP-006]
    profile: SYNTRA-1.0-TCP
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    input:
      transport:
        action: tcp_protected_stream_negatives
        variants: [truncated_record, corrupted_tag, replayed_record, zero_inner_length, inner_length_1048577]
        one_variant_per_run: true
        allocation_proof_required: true
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      transport: { protected_dispatch: false, resynchronization: false, allocation_above_frame_limit: false }
    notes: "One independent fault per run; malformed lengths are injected inside authenticated plaintext, not substituted for the outer u16BE prefix."
