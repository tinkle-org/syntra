# Portable RPC cases (Section G). Profile: SNTR-RPC-V1. All Mandatory.
# Prose companion: specifications/rpc.md (CONF-RPC-001…013).
format_version: "1.0"
profile: SNTR-RPC-V1
cases:
  - id: CONF-RPC-001
    requirement: [SNTR-RPC-001, SNTR-RPC-002, SNTR-RPC-003, SNTR-RPC-006]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 7, body: request, method: "/example.Echo/Echo", payload_b64: "aGVsbG8=", timeout_ms: 500 }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - { request_id: 7, body: result, payload_b64: "aGVsbG8=" }
    notes: "Request/response correlation with bit-identical payload on an active connection. Repeat with empty and arbitrary non-UTF-8 payloads."
    vector_refs: ["protobuf/GOLD-PROT-REQ-01", "protobuf/GOLD-PROT-RES-OK-01"]

  - id: CONF-RPC-002
    requirement: [SNTR-RPC-002, SNTR-RPC-008, SNTR-REL-007]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 7, body: request, method: "/example.Echo/Echo", payload_b64: "YQ==", timeout_ms: 2000 }
        - { request_id: 8, body: request, method: "/example.KV/Get", payload_b64: "Yg==", timeout_ms: 2000 }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - { request_id: 7, body: result }
        - { request_id: 8, body: result }
    notes: "Two concurrent terminal results, each correlated exactly once, without cross-delivery. Host capacity is at least 16 concurrent RPCs per connection; no lower floor may be negotiated. Floor-capacity coverage with deliberate out-of-order completion is CONF-RPC-013."

  - id: CONF-RPC-003
    requirement: [SNTR-RPC-002]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 7, body: request, method: "/example.Echo/Echo", payload_b64: "c2xvdy0=", timeout_ms: 5000 }
        - { request_id: 8, body: request, method: "/example.KV/Get", payload_b64: "ZmFzdA==", timeout_ms: 5000 }
      faults: { complete_second_first: true }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - { request_id: 8, body: result }
        - { request_id: 7, body: result }
    notes: "Out-of-order responses: completion order is insignificant; correlation is by request_id only; initiator never assumes FIFO."

  - id: CONF-RPC-004
    requirement: [SNTR-RPC-002, SNTR-RPL-012]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 7, body: request, method: "/example.Echo/Echo", payload_b64: "Zmlyc3Q=", timeout_ms: 2000 }
        - { request_id: 7, body: request, method: "/example.Echo/Echo", payload_b64: "c2Vjb25k", timeout_ms: 2000 }
      faults:
        duplicate_while_pending: { barrier: first_terminal_result, release_after: violation_and_closure }
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: FAILED_PRECONDITION, observer: detecting_host, carriage: local_only }
      frames: []
    notes: "Duplicate request ID on one connection (SNTR-RPC-002, SNTR-RPL-012). The harness admits the first request and holds its uncommitted terminal candidate behind duplicate_while_pending: {barrier: first_terminal_result, release_after: violation_and_closure}. It injects duplicate ID 7 while the original is outstanding. The host detects N <= H at admission, never admits or dispatches the offending frame, records local FAILED_PRECONDITION and terminates. Release the barrier only after violation and closure: no RpcResult under ID 7 and no zero-ID error Frame is emitted. The held candidate is discarded or becomes undeliverable; an already-selected terminal outcome remains immutable and closure never rolls back committed effects. The original RPC's peer-visible outcome is unknown (UNAVAILABLE), never success. This invalid stimulus is harness-injected; conforming initiators never emit duplicate IDs. Ambiguous-loss coverage is CONF-RPC-012."

  - id: CONF-RPC-005
    requirement: [SNTR-RPC-001, SNTR-RPC-030, SNTR-ERR-003]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 11, body: request, method: "/example.Unknown/Call", payload_b64: "eA==", timeout_ms: 500 }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: UNIMPLEMENTED, message_pattern: "NEGATIVE:panic" }
    notes: "Unknown method returns an RPC error without handler dispatch; connection stays usable. Distinct from malformed-method INVALID_ARGUMENT."

  - id: CONF-RPC-006
    requirement: [SNTR-RPC-002]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 99, body: result, payload_b64: "b3JwaGFu" }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
    notes: "Result for unknown ID is locally ignored with a diagnostic; no error storm, state change or completion signaled."

  - id: CONF-RPC-007
    requirement: [SNTR-RPC-004, SNTR-REL-006]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 9, body: request, method: "/example.Echo/Echo", payload_b64: "c2xvdy0=", timeout_ms: 100 }
      faults: { handler_delay_ms: 1000 }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: DEADLINE_EXCEEDED }
    notes: "Responder enforces the effective deadline; initiator timer <= requested budget; expiry surfaces DEADLINE_EXCEEDED and handler effects remain unknown."

  - id: CONF-RPC-008
    requirement: [SNTR-RPC-005, SNTR-RPC-021, SNTR-RPC-031]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 12, body: request, method: "/example.Echo/Echo", payload_b64: "Y2FuY2VsLW1l", timeout_ms: 5000 }
        - { request_id: 12, body: cancel }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: CANCELLED }
    notes: "Best-effort cancellation: cancel-before-completion yields CANCELLED. Run completion-wins and unknown-ID-ignore sub-cases; exactly one terminal result per run. This fixture does not assert the cancel-vs-deadline tie-break; consult specifications/rpc.md for that rule."

  - id: CONF-RPC-009
    requirement: [SNTR-RPC-006, SNTR-ERR-002, SNTR-ERR-003]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 13, body: request, method: "/example.Echo/Echo", payload_b64: "eA==", timeout_ms: 500 }
      faults: { handler_outcome: rpc_error, code: INTERNAL }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: INTERNAL, message_pattern: "NEGATIVE:SELECT" }
    notes: "RpcError propagation uses result{error{code,message}} with a known nonzero code and generic message. Connection-level errors such as a zero-ID request are exercised by CONF-CORE-009."

  - id: CONF-RPC-010
    requirement: [SNTR-RPC-002, SNTR-ERR-004]
    profile: SNTR-RPC-V1
    roles: [client]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 14, body: result }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: INVALID_ARGUMENT }
    notes: "Harness first establishes outstanding RPC 14, then the responder emits this result with neither payload nor error selected. The client reports local INVALID_ARGUMENT for that RPC, never success; no error response on the wire is required."

  - id: CONF-RPC-011
    requirement: [SNTR-RPC-007, SNTR-RPC-010, SNTR-REL-003, SNTR-REL-004]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 100, body: request, method: "/example.Echo/Echo", payload_b64: "b3AtQUJD", timeout_ms: 2000 }
      faults: { transport_loss_before_result: true }
      replay:
        new_connection: true
        frames:
          - { request_id: 201, body: request, method: "/example.Echo/Echo", payload_b64: "b3AtQUJD", timeout_ms: 2000 }
    expected:
      connection_state: ACTIVE
      session_state: active
      retry: "request_ids differ (201 != 100); operation-key bytes bit-preserved; server behavior matches its documented dedup policy; core never deduplicates by request_id"
    notes: "Idempotent retry uses a fresh request_id on the new connection and the same application operation key inside the opaque payload. Unknown-outcome loss retries only idempotent/with-key operations."

  - id: CONF-RPC-012
    requirement: [SNTR-HS-014, SNTR-REL-009, SNTR-CORE-005]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      faults: { abrupt_transport_loss: true, in_flight_request_ids: [7, 8] }
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE, message_pattern: "NEGATIVE:success" }
    notes: "Loss before any result maps to UNAVAILABLE with unknown outcome, never success or proof of non-execution."

  - id: CONF-RPC-013
    requirement: [SNTR-RPC-002, SNTR-RPC-008]
    profile: SNTR-RPC-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [active_session]
    applicable_transports: [tcp_tls, ws_wss]
    input:
      frames:
        - { request_id: 21, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAyMQ==", timeout_ms: 2000 }
        - { request_id: 22, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAyMg==", timeout_ms: 2000 }
        - { request_id: 23, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAyMw==", timeout_ms: 2000 }
        - { request_id: 24, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAyNA==", timeout_ms: 2000 }
        - { request_id: 25, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAyNQ==", timeout_ms: 2000 }
        - { request_id: 26, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAyNg==", timeout_ms: 2000 }
        - { request_id: 27, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAyNw==", timeout_ms: 2000 }
        - { request_id: 28, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAyOA==", timeout_ms: 2000 }
        - { request_id: 29, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAyOQ==", timeout_ms: 2000 }
        - { request_id: 30, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAzMA==", timeout_ms: 2000 }
        - { request_id: 31, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAzMQ==", timeout_ms: 2000 }
        - { request_id: 32, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAzMg==", timeout_ms: 2000 }
        - { request_id: 33, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAzMw==", timeout_ms: 2000 }
        - { request_id: 34, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAzNA==", timeout_ms: 2000 }
        - { request_id: 35, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAzNQ==", timeout_ms: 2000 }
        - { request_id: 36, body: request, method: "/example.Echo/Echo", payload_b64: "cnBjLXAzNg==", timeout_ms: 2000 }
      faults:
        reverse_completion_order: { barrier: all_admitted }
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - { request_id: 36, body: result, payload_b64: "cnBjLXAzNg==" }
        - { request_id: 35, body: result, payload_b64: "cnBjLXAzNQ==" }
        - { request_id: 34, body: result, payload_b64: "cnBjLXAzNA==" }
        - { request_id: 33, body: result, payload_b64: "cnBjLXAzMw==" }
        - { request_id: 32, body: result, payload_b64: "cnBjLXAzMg==" }
        - { request_id: 31, body: result, payload_b64: "cnBjLXAzMQ==" }
        - { request_id: 30, body: result, payload_b64: "cnBjLXAzMA==" }
        - { request_id: 29, body: result, payload_b64: "cnBjLXAyOQ==" }
        - { request_id: 28, body: result, payload_b64: "cnBjLXAyOA==" }
        - { request_id: 27, body: result, payload_b64: "cnBjLXAyNw==" }
        - { request_id: 26, body: result, payload_b64: "cnBjLXAyNg==" }
        - { request_id: 25, body: result, payload_b64: "cnBjLXAyNQ==" }
        - { request_id: 24, body: result, payload_b64: "cnBjLXAyNA==" }
        - { request_id: 23, body: result, payload_b64: "cnBjLXAyMw==" }
        - { request_id: 22, body: result, payload_b64: "cnBjLXAyMg==" }
        - { request_id: 21, body: result, payload_b64: "cnBjLXAyMQ==" }
    notes: "16 simultaneously outstanding RPCs with distinct opaque payloads rpc-p21...rpc-p36 and exactly one correlated terminal result per request. Each result payload equals its requester's payload exactly, so cross-delivery fails. Initiator sends all 16 without awaiting responses. The reverse_completion_order fault holds all results behind all_admitted, then releases them in descending request_id order. Correlation is solely by request_id, never FIFO. No lower capacity floor may be negotiated; work above the documented maximum is rejected with RESOURCE_EXHAUSTED."
