# Planned independent execution; no per-case or interop PASS is recorded here.
format_version: "1.0"
specification: conformance/README.md
status: not-executed
pairs:
  - id: INTEROP-CORE-2T
    name: "same logical RPC outcomes over encrypted TCP and WSS"
    requirement: [SNTR-SER-002]
    required_for: "two-carrier independence proof, not a single-carrier claim"
    legs:
      - { transport: SYNTRA-1.0-TCP, cases: [CONF-SCT-001, CONF-SCT-002, CONF-SCT-005, CONF-CORE-001] }
      - { transport: SYNTRA-1.0-WSS, cases: [CONF-SCW-043, CONF-SCW-002, CONF-SCW-005, CONF-CORE-001] }
    asserts: ["equal decoded RPC requests/results and bit-preserved opaque bytes", "independent fresh channel keys and core readiness on each leg", "u16BE TCP messages versus reassembled binary WS messages; both protect inner u32BE frames"]

  - id: INTEROP-CORE-2I
    name: "independent implementations, both roles and both channel modes"
    requirement: [SNTR-SC-003, SNTR-SCW-002]
    required_for: "independent wire evidence for each claimed canonical carrier"
    for_each_profile: [SYNTRA-1.0-TCP, SYNTRA-1.0-WSS, SYNTRA-1.0-WS]
    modes: [bootstrap, returning]
    legs:
      - { role_assignment: "A initiates, B hosts", transport: selected_profile }
      - { role_assignment: "B initiates, A hosts", transport: selected_profile }
    asserts: ["independent codebases and separately provisioned trust", "exact syntra.1.0 context with actual carrier code; no alias fallback", "WSS verifies TLS 1.3 chain and endpoint name before Upgrade/M1", "confirmation and protected hello/ready precede RPC dispatch", "same logical echo outcomes, no ciphertext byte-equality claim"]

  - id: INTEROP-EVENT-ABSENT
    name: "mandatory-only host against capability-aware peer"
    requirement: [SNTR-CAP-003]
    legs:
      - { mandatory_only_host: true, full_peer: true, transport: SYNTRA-1.0-WSS }
    asserts: ["unclaimed events refused without affecting mandatory RPC", "capability prerequisite absent means SKIP/UNSUPPORTED, never PASS"]
